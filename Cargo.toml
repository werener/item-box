[package]
name = "v-tool-box"
version = "0.1.0"
authors = ["werener <lenyazhuk@yandex.ru>"]
edition = "2021"

[dependencies]
async-trait = "0.1.91"
dioxus = { version = "0.7.1", features = [] }
directories = "6.0.0"
fully_pub = "0.1.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.19"
uuid = { version = "1.23.3", features = ["v4", "serde", "js"] }

tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "time", "io-util"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.100", features = ["Window", "Storage", "Blob", "Url"] }
idb = "0.6"
js-sys = "0.3"
wasm-bindgen = "0.2"
gloo-timers = { version = "0.4", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.1", features = ["fs"] }